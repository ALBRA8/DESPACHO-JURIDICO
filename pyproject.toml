[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "albra-despacho-juridico"
version = "2.5.1"
description = "DESPACHO JURÍDICO DIGITAL ALBRA V2.5 — Agente jurídico colombiano con Matters, Citation Audit, MCP server, White-label, X402"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary - ALBRA"}
authors = [{name = "ALBRA Constructor"}]
keywords = ["legal-agent", "ai-agent", "mcp", "albra", "juridico"]

dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "click>=8.1",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
vector = ["chromadb>=0.4.24"]
nlp = ["openai>=1.0", "anthropic>=0.18"]
file = ["pypdf>=4.0", "python-docx>=1.1", "openpyxl>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "python-docx>=1.1",
]

[project.scripts]
albra = "albra.cli:main"

[tool.setuptools.packages.find]
include = ["albra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Reglas que importan para detectar bugs reales, no opinions de estilo.
select = [
    "E",   # pycodestyle errors (syntax)
    "F",   # pyflakes (undefined names, unused imports, etc.)
    "I",   # isort (import order)
    "W",   # pycodestyle warnings
    "B",   # bugbear (likely bugs)
]
ignore = [
    "E501",   # line too long (cosmetic)
    "E402",   # module-level import not at top (we do conditional imports)
    "E722",   # bare except (we use it intentionally in some places)
    "E731",   # lambda assignment (acceptable in some cases)
    "B008",   # function call in defaults (FastAPI Depends pattern)
    "B904",   # raise from in except - we have many but acceptable
    "B007",   # loop variable not used - acceptable
    "B017",   # pytest.raises(Exception) - acceptable in tests
    "B027",   # empty abstract method (acceptable - we use ... or pass intentionally)
    "B028",   # no stacklevel - acceptable
    "B904",   # raise from in except - acceptable
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401", "F811", "B017"]
"albra/__init__.py" = ["F401"]
"albra/**/__init__.py" = ["F401"]
"src/**/__init__.py" = ["F401"]

