[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "albra-despacho-juridico"
version = "1.0.0"
description = "DESPACHO JURÍDICO DIGITAL ALBRA — Agente Base V1.0"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary - ALBRA"}
authors = [{name = "ALBRA Constructor"}]
keywords = ["legal-agent", "ai-agent", "mcp", "albra", "juridico"]

dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "click>=8.1",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
vector = ["chromadb>=0.4.24"]
nlp = ["openai>=1.0", "anthropic>=0.18"]
file = ["pypdf>=4.0", "python-docx>=1.1", "openpyxl>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]

[project.scripts]
albra = "albra.cli:main"

[tool.setuptools.packages.find]
include = ["albra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
