name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (no || true - failures fail CI)
        run: |
          ruff check albra/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit + integration tests
        run: |
          pytest -v --tb=short

      - name: Run security + restart tests
        run: |
          pytest tests/test_v15_parity.py tests/test_agent_integration.py -v --tb=short

  clean-room:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone fresh + verify
        run: |
          git clone https://github.com/ALBRA8/DESPACHO-JURIDICO.git fresh
          cd fresh
          python -m venv .venv
          . .venv/bin/activate
          pip install -e ".[dev]"
          pytest -v --tb=short
          . .venv/bin/activate && albra info | head -5
