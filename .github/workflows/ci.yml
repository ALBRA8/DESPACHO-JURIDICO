name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# CI corre sobre el commit exacto que se está evaluando (github.sha)
# El clean-room job clona específicamente ese commit, no main ambiguamente.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (fail-on-error)
        run: |
          ruff check albra/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run all tests (fail-on-error)
        env:
          # CI inyecta secretos efímeros pero fuertes para tests.
          # NO son defaults operativos - solo para CI.
          ALBRA_JWT_SECRET: ci-ephemeral-jwt-secret-not-for-production-32chars
          ALBRA_ADMIN_PASSWORD: ci-ephemeral-admin-pass-1234
        run: |
          pytest -v --tb=short

  clean-room:
    """Clean-room verification: clona el commit exacto que se certifica,
    no main ambiguamente. Esto garantiza que la evidencia reproducible
    corresponde al commit bajo evaluación.
    """
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clean-room verification on commit ${{ github.sha }}
        env:
          ALBRA_JWT_SECRET: ci-ephemeral-jwt-secret-not-for-production-32chars
          ALBRA_ADMIN_PASSWORD: ci-ephemeral-admin-pass-1234
        run: |
          echo "=== Clean-room verification on commit ${{ github.sha }} ==="
          git clone https://github.com/ALBRA8/DESPACHO-JURIDICO.git fresh
          cd fresh
          git checkout ${{ github.sha }}
          echo "=== Verified commit ==="
          git log --oneline -1
          python -m venv .venv
          . .venv/bin/activate
          pip install -e ".[dev]"
          echo "=== Lint ==="
          ruff check albra/ tests/
          echo "=== Tests ==="
          pytest -v --tb=short
          echo "=== CLI smoke ==="
          albra info | head -5
          echo "=== Clean-room PASS on commit ${{ github.sha }} ==="
